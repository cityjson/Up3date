name: Create release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read project version
        id: project_version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        env:
          PROJECT_VERSION: ${{ steps.project_version.outputs.version }}
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the 0.0.0 format without a prefix."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "${PROJECT_VERSION}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PROJECT_VERSION}."
            exit 1
          fi

      - name: Read release notes
        id: release_notes
        env:
          PROJECT_VERSION: ${{ steps.project_version.outputs.version }}
        run: |
          notes_file="${RUNNER_TEMP}/up3date-release-notes.md"
          awk -v version="${PROJECT_VERSION}" '
            index($0, "## [" version "]") == 1 { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > "${notes_file}"

          if [[ -z "$(tr -d '[:space:]' < "${notes_file}")" ]]; then
            echo "No notes found for version ${PROJECT_VERSION} in CHANGELOG.md."
            exit 1
          fi

          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_VERSION: ${{ steps.project_version.outputs.version }}
          RELEASE_NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
        run: |
          if gh release view "${PROJECT_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${PROJECT_VERSION} already exists; skipping."
            exit 0
          fi

          gh release create "${PROJECT_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --target "${GITHUB_SHA}" \
            --title "${PROJECT_VERSION}" \
            --notes-file "${RELEASE_NOTES_FILE}"
